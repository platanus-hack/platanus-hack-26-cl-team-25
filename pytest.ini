[pytest]
asyncio_mode = auto
timeout = 120
testpaths = acceptance victim/tests shadow/tests gateway/tests pipeline/tests patcher/tests sim/tests dashboard/tests anticipate/tests fleet/tests immune/tests sidecar/tests
norecursedirs = runtime .venv node_modules
filterwarnings =
    ignore::DeprecationWarning
markers =
    docker: needs Docker
    live: calls the LLM
