# Lab target: public source code of a released version that was later fixed.
# Nothing here runs the server or sends traffic; the analysis is on source code only.
id: apache-httpd-2.4.49
name: Apache HTTP Server 2.4.49
repo: https://github.com/apache/httpd.git
vulnerable_ref: "2.4.49"
fixed_ref: "2.4.50"
language: c
vuln_class: traversal
# Shown in the report only. NEVER given to the model.
advisory: "CVE-2021-41773 — public advisory, fixed upstream in 2.4.50"
# What the model is told about the area (generic, no hint about the bug).
area: >-
  URL path normalization that runs on every request before the path is mapped to the filesystem.
  It decodes percent-encoded unreserved characters and removes dot-segments.
scope:            # the model may read and edit these
  - server/util.c
context:          # read-only
  - include/httpd.h
check:
  kind: c-function
  file: server/util.c
  functions:      # extracted from the file (vulnerable, ours, official) and unit-tested in isolation
    - "static char x2c(const char *what)"
    - "AP_DECLARE(int) ap_normalize_path(char *path, unsigned int flags)"
  shim: shim.h
  vectors: vectors.yaml
