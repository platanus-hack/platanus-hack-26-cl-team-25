openapi: 3.0.3
info: {title: Tienda (victim app), version: "t0"}
# x-owner-scoped: resource belongs to one user (gateway detonates for untrusted identities)
# x-sensitive: never grammar-checked, redacted in recordings
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer}
  schemas:
    Id: {type: integer, minimum: 1}
paths:
  /health:
    get: {operationId: health, responses: {"200": {description: '{"ok": true}'}}}
  /api/register:
    post:
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email: {type: string, maxLength: 120}
                password: {type: string, x-sensitive: true}
                name: {type: string, maxLength: 80}
      responses: {"201": {description: '{"id": int, "token": str}'}, "409": {description: email taken}}
  /api/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, maxLength: 120}
                password: {type: string, x-sensitive: true}
      responses: {"200": {description: '{"token": str, "id": int}'}, "401": {description: bad credentials}}
  /api/me:
    get:
      operationId: me
      security: [{bearer: []}]
      responses: {"200": {description: '{"id","email","name","address","phone","role"}'}, "401": {description: no token}}
  /api/products:
    get:
      operationId: listProducts
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 80}}
        - {name: category, in: query, schema: {type: string, enum: [audio, cables, storage, accessories]}}
        - {name: sort, in: query, schema: {type: string, enum: [name, price, newest]}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 1000}}
      responses: {"200": {description: '{"items":[{"id","name","category","price","description"}], "page": int, "total": int}'}}
  /api/products/{product_id}:
    get:
      operationId: getProduct
      parameters: [{name: product_id, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}]
      responses: {"200": {description: product}, "404": {description: not found}}
  /api/products/{product_id}/image:
    get:
      operationId: productImage
      parameters:
        - {name: product_id, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
        - {name: file, in: query, required: true, schema: {type: string, maxLength: 80}}
      responses: {"200": {description: file bytes from APP_STATIC/images}, "404": {description: not found}}
  /api/files/download:
    get:
      operationId: downloadFile
      parameters: [{name: name, in: query, required: true, schema: {type: string, maxLength: 80}}]
      responses: {"200": {description: file bytes from APP_STATIC/manuals}, "404": {description: not found}}
  /api/orders:
    get:
      operationId: listOrders
      security: [{bearer: []}]
      responses: {"200": {description: '{"items":[order]} — only the caller''s orders'}}
    post:
      operationId: createOrder
      security: [{bearer: []}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                note: {type: string, maxLength: 200}
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [product_id, qty]
                    properties:
                      product_id: {$ref: '#/components/schemas/Id'}
                      qty: {type: integer, minimum: 1, maximum: 99}
      responses: {"201": {description: order}}
  /api/orders/{order_id}:
    get:
      operationId: getOrder
      x-owner-scoped: true
      security: [{bearer: []}]
      parameters: [{name: order_id, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}]
      responses: {"200": {description: '{"id","user_id","status","total","note","shipping_address","created_at","items":[...]}'}, "404": {description: not found}}
  /api/orders/{order_id}/invoice:
    get:
      operationId: getInvoice
      x-owner-scoped: true
      security: [{bearer: []}]
      parameters: [{name: order_id, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}]
      responses: {"200": {description: 'text/plain invoice rendered from the database (customer name, address, items, total)'}, "404": {description: not found}}
  /api/users/{user_id}/profile:
    get:
      operationId: getUserProfile
      x-owner-scoped: true
      security: [{bearer: []}]
      parameters: [{name: user_id, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}]
      responses: {"200": {description: '{"id","name","email","address","phone"}'}, "404": {description: not found}}
  /api/admin/orders:
    get:
      operationId: adminOrders
      security: [{bearer: []}]
      responses: {"200": {description: 'all orders; role admin only'}, "403": {description: not admin}}
