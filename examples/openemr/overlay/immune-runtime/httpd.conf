# Inmune: Apache for OpenEMR 8.2.0 as the unprivileged `apache` user on ${IMMUNE_LISTEN} (HOST:8080),
# read-only root filesystem. The OpenEMR rules are those of the image's conf.d/openemr.conf (plain HTTP:
# TLS ends before the gateway). Fixed pool of prefork workers: no process is created while a request runs.
ServerRoot /var/www
ServerName localhost
Listen ${IMMUNE_LISTEN}

LoadModule mpm_prefork_module /usr/lib/apache2/mod_mpm_prefork.so
LoadModule authn_core_module /usr/lib/apache2/mod_authn_core.so
LoadModule authz_core_module /usr/lib/apache2/mod_authz_core.so
LoadModule authz_host_module /usr/lib/apache2/mod_authz_host.so
LoadModule access_compat_module /usr/lib/apache2/mod_access_compat.so
LoadModule allowmethods_module /usr/lib/apache2/mod_allowmethods.so
LoadModule reqtimeout_module /usr/lib/apache2/mod_reqtimeout.so
LoadModule mime_module /usr/lib/apache2/mod_mime.so
LoadModule log_config_module /usr/lib/apache2/mod_log_config.so
LoadModule env_module /usr/lib/apache2/mod_env.so
LoadModule headers_module /usr/lib/apache2/mod_headers.so
LoadModule setenvif_module /usr/lib/apache2/mod_setenvif.so
LoadModule unixd_module /usr/lib/apache2/mod_unixd.so
LoadModule dir_module /usr/lib/apache2/mod_dir.so
LoadModule alias_module /usr/lib/apache2/mod_alias.so
LoadModule rewrite_module /usr/lib/apache2/mod_rewrite.so
LoadModule php_module /usr/lib/apache2/mod_php85.so

PidFile /tmp/openemr/httpd.pid
DefaultRuntimeDir /tmp/openemr
Mutex file:/tmp/openemr default
ErrorLog /dev/stderr
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
CustomLog /dev/stdout combined
TypesConfig /etc/apache2/mime.types

StartServers 4
MinSpareServers 4
MaxSpareServers 4
ServerLimit 4
MaxRequestWorkers 4
MaxConnectionsPerChild 0
Timeout 60
KeepAlive Off

LimitRequestFieldSize 32768
HTTPProtocolOptions Strict
Protocols http/1.1
ServerSignature off
ServerTokens Prod
TraceEnable off
FileETag None
Header unset ETag
Header set X-XSS-Protection "1; mode=block"

DirectoryIndex index.php index.html
<FilesMatch \.php$>
    SetHandler application/x-httpd-php
</FilesMatch>

<Directory />
    AllowOverride None
    Require all denied
</Directory>

DocumentRoot /var/www/localhost/htdocs/openemr
<Directory /var/www/localhost/htdocs/openemr>
    AllowMethods GET POST PUT PATCH DELETE HEAD OPTIONS
    Options -Indexes +FollowSymLinks
    AllowOverride FileInfo
    Require all granted
</Directory>
<Directory "/var/www/localhost/htdocs/openemr/sites">
    AllowOverride None
</Directory>
<Directory "/var/www/localhost/htdocs/openemr/sites/*/documents">
    Require all denied
</Directory>
<Directory "/tmp/openemr">
    Require all denied
</Directory>
<Directory "/var/www/localhost/htdocs/openemr/bin">
    Require all denied
</Directory>

# Session introspection for Inmune's gateway (auth.kind introspect): {id, role} of the caller's session.
Alias /_immune/whoami /immune/whoami.php
<Directory /immune>
    Require all denied
    <Files "whoami.php">
        Require all granted
    </Files>
</Directory>
